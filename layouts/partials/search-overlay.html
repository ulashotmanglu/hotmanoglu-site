{{/*
  Arama katmanı. JavaScript kapalıysa hiç görünmez (buton da işlevsizdir),
  sayfanın geri kalanı etkilenmez. İndeks /index.json üzerinden yüklenir.
*/}}
<div class="search-overlay" id="searchOverlay" hidden>
  <div class="search-panel" role="dialog" aria-modal="true" aria-label="Sitede ara">
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="searchInput" class="search-input" placeholder="Başlık, konu veya etiket ara…" autocomplete="off" aria-label="Arama terimi" aria-controls="searchResults">
      <button class="icon-btn" id="searchClose" aria-label="Aramayı kapat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>
    <div class="search-results" id="searchResults" role="region" aria-live="polite">
      <p class="search-hint">En az iki karakter yazın.</p>
    </div>
  </div>
</div>
