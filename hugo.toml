baseURL = "https://www.hotmanoglu.com/"
languageCode = "tr"
title = "HOTMANOGLU"
[pagination]
  pagerSize = 12
enableRobotsTXT = true

[params]
  description = "Teknoloji, ekonomi ve finansal suçlar üzerine bağımsız Türkçe yayın."
  author = "Ulaş Hotmanoğlu"
  tagline = "Bağımsız dijital yayın"
  brandline = "Teknoloji, ekonomi ve finansal suçlar üzerine."
  linkedin = "https://www.linkedin.com/in/ulas-hotmanoglu-ab039b16b/"
  twitter = ""
  email = ""

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # content/posts içinde ham HTML kullanılmıyor (iframe/script/style/div/
      # img/a/table/br/sup taraması: 0 dosya), bu yüzden kapatıldı.
      unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

# "İlgili İçerikler" bloğu için — etiket ve kategori ağırlıklı benzerlik.
[related]
  includeNewer = true
  threshold = 20
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 60

  [[related.indices]]
    name = "date"
    weight = 10

# JSON: istemci tarafı arama indeksi (/index.json)
[outputs]
  home = ["HTML", "RSS", "JSON", "ROBOTS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
