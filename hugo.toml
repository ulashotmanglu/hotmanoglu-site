baseURL = "https://www.hotmanoglu.com/"
languageCode = "tr"
title = "HOTMANOGLU"
[pagination]
  pagerSize = 12
enableRobotsTXT = true

# ─────────────────────────────────────────────────────────────
# GÖRSEL MOUNT KATMANI
#
# Hugo yalnızca assets altındaki dosyaları işleyebilir; static
# altındakiler olduğu gibi kopyalanır. Görseller ise static/img/posts
# altında durmak zorunda: sanal-ofis publisher (static/admin.html)
# GitHub API ile oraya yüklüyor, o dizini listeliyor ve front matter'a
# /img/posts/<slug>.<ext> yazıyor.
#
# Aşağıdaki mount, static/img'i ikinci bir ad altında assets/img olarak
# da görünür kılar. Tek fiziksel kopya vardır:
#   - /img/posts/x.png olarak static gibi yayınlanmaya devam eder
#     (eski URL'ler, publisher önizlemesi ve paylaşılmış og:image'lar
#      kırılmaz)
#   - resources.Get "img/posts/x.png" ile işlenebilir hale gelir
#     (WebP + responsive varyantlar)
#
# assets mount'u da açıkça yazılmalı: bir hedef kök için mount
# tanımlandığında o kökün varsayılanı devre dışı kalır, aksi halde
# assets/css ve assets/js kaybolur.
# ─────────────────────────────────────────────────────────────
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/img"
    target = "assets/img"

[params]
  description = "Teknoloji, ekonomi ve finansal suçlar üzerine bağımsız Türkçe yayın."
  author = "Ulaş Hotmanoğlu"
  tagline = "Bağımsız dijital yayın"
  brandline = "Teknoloji, ekonomi ve finansal suçlar üzerine."
  linkedin = "https://www.linkedin.com/in/ulas-hotmanoglu-ab039b16b/"
  twitter = ""
  email = ""

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      # content/posts içinde ham HTML kullanılmıyor (iframe/script/style/div/
      # img/a/table/br/sup taraması: 0 dosya), bu yüzden kapatıldı.
      unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

# "İlgili İçerikler" bloğu için — etiket ve kategori ağırlıklı benzerlik.
[related]
  includeNewer = true
  threshold = 20
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100

  [[related.indices]]
    name = "categories"
    weight = 60

  [[related.indices]]
    name = "date"
    weight = 10

# JSON: istemci tarafı arama indeksi (/index.json)
[outputs]
  home = ["HTML", "RSS", "JSON", "ROBOTS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
